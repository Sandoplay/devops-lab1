apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: weather_user
            - name: POSTGRES_PASSWORD
              value: weather_password
            - name: POSTGRES_DB
              value: weather_db
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "weather_user"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "weather_user"]
            initialDelaySeconds: 15
            periodSeconds: 20